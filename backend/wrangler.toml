name = "systemsaviour-backend"
main = "worker.js"
compatibility_date = "2024-01-01"
account_id = "d6a573fb6c8125d26bf1e3bea89353c9"

# Cloudflare D1 Database Binding for Relational Storage
[[d1_databases]]
binding = "DB"
database_name = "systemsaviour_db"
database_id = "systemsaviour-d1-db"

# Cloudflare KV Storage Binding for Fast Ephemeral Caching & Rate Limiting
[[kv_namespaces]]
binding = "SYSTEM_SAVIOUR_KV"
id = "4dc06fdfe907434ab1294b3660fcd164"

# Cloudflare R2 Bucket for Large Topology Snapshots
[[r2_buckets]]
binding = "SYSTEM_SAVIOUR_BUCKET"
bucket_name = "systemsaviour-data"

[vars]
ENVIRONMENT = "production"
APP_NAME = "System Saviour Cloudflare Backend"
